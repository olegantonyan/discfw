pid_file "/var/run/mpd.pid"
state_file "/usr/data/discfw/mpd/state"
restore_paused "yes"
playlist_directory "/usr/data/discfw/mpd/playlists"
log_file "syslog"
bind_to_address "/run/mpd.sock"
bind_to_address "any"
port "6600"
replaygain "off"
volume_normalization "no"

audio_output {
	type "alsa"
	name "DAC"
	device "disc"
	format "*:32:2"
	allowed_formats "44100:32:2 32000:32:2 48000:32:2 88200:32:2 96000:32:2 176400:32:2 192000:32:2 352800:32:2 384000:32:2"
	mixer_type "none"
	period_time "40000"
}

audio_output {
	type "alsa"
	name "BT"
	device "bluealsa"
	mixer_type "software"
	enabled "no"
}
