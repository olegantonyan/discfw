pcm_hook_type.disc {
	install "disc_hook_install"
	lib "/usr/lib/alsa-lib/libdisc_hook.so"
}

pcm.disc_dac {
	type hooks
	slave.pcm "hw:0,3"
	hooks.0 {
		type disc
	}
}

pcm.disc {
	type disc_eq
	output "dac"
	slave.pcm "disc_dac"
}

pcm.disc_spdif_hw {
	type hw
	card 0
	device 4
}

pcm.disc_spdif {
	type disc_eq
	output "spdif"
	slave.pcm "disc_spdif_hw"
}

pcm.disc_bt {
	type disc_eq
	output "bt"
	slave.pcm "bluealsa"
}

pcm.disc_spdif24 {
	type plug
	slave {
		pcm "disc_spdif"
		format S24_LE
	}
}

pcm.disc_spdif176 {
	type plug
	slave {
		pcm "disc_spdif"
		format S24_LE
		rate 176400
	}
}

pcm.disc_spdif192 {
	type plug
	slave {
		pcm "disc_spdif"
		format S24_LE
		rate 192000
	}
}

pcm.!default {
	type plug
	slave {
		pcm "disc"
		format S32_LE
		channels 2
	}
}

ctl.!default {
	type hw
	card 0
}
